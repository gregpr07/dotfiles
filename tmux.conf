
# ── Mouse & basics ──────────────────────────────────────────
set -g mouse on
set -sg escape-time 10
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"

# Auto re-tile panes when one is created or closed.
# Do not re-tile after resize: it cancels pane zoom and manual sizing.
set-hook -g after-split-window "select-layout tiled"
set-hook -g pane-exited "select-layout tiled"
set-hook -gu after-resize-pane

# ── Copy to system clipboard ───────────────────────────────
if-shell "command -v pbcopy >/dev/null 2>&1" {
    bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
    bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
} {
    if-shell "command -v xclip >/dev/null 2>&1" {
        bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
        bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
    } {
        bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xsel --clipboard --input"
        bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xsel --clipboard --input"
    }
}

# Scroll: mouse wheel scrolls tmux history
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"

# Don't copy on mouse select — just highlight. Use Enter to copy if needed.
unbind -T copy-mode MouseDragEnd1Pane
unbind -T copy-mode-vi MouseDragEnd1Pane

# Pane resizing by mouse drag (default tmux behavior)
unbind -n MouseDrag1Border

# ── Agent management ───────────────────────────────────────
# M-t: new agent as a TAB (own window, fullscreen)
bind -n M-t display-menu -T " New Tab " -x C -y C \
    "Claude Code"  c "new-window -n claude -c '#{pane_current_path}' 'claude --dangerously-skip-permissions'" \
    "Codex"        x "new-window -n codex  -c '#{pane_current_path}' 'codex --yolo'" \
    "Shell"        s "new-window -n shell  -c '#{pane_current_path}'" \
    ""             "" "" \
    "Cancel"       q ""

# M-n: new agent as a PANE (split, tiled next to current)
bind -n M-n display-menu -T " New Pane " -x C -y C \
    "Claude Code"  c "split-window -h -c '#{pane_current_path}' 'claude --dangerously-skip-permissions' ; select-layout tiled" \
    "Codex"        x "split-window -h -c '#{pane_current_path}' 'codex --yolo' ; select-layout tiled" \
    "Shell"        s "split-window -h -c '#{pane_current_path}' ; select-layout tiled" \
    ""             "" "" \
    "Cancel"       q ""

# M-c / M-x / M-s: new pane (split + tile)
bind -n M-c split-window -h -c '#{pane_current_path}' 'claude --dangerously-skip-permissions' \; select-layout tiled
bind -n M-x split-window -h -c '#{pane_current_path}' 'codex --yolo' \; select-layout tiled
bind -n M-t split-window -h -c '#{pane_current_path}' \; select-layout tiled

# M-C / M-X / M-S: new tab (own window)
bind -n M-C new-window -n claude -c '#{pane_current_path}' 'claude --dangerously-skip-permissions'
bind -n M-X new-window -n codex  -c '#{pane_current_path}' 'codex --yolo'
bind -n M-T new-window -n shell  -c '#{pane_current_path}'

# M-Tab: cycle between tabs (windows)
bind -n M-Tab next-window

# M-[ / M-]: prev/next tab
bind -n M-[ previous-window
bind -n M-] next-window

# M-r: rotate layout (horizontal ↔ vertical ↔ tiled)
bind -n M-r next-layout

# M-z: zoom/unzoom current pane
bind -n M-z resize-pane -Z

# M-1..5: jump to tab by number
bind -n M-1 select-window -t :0
bind -n M-2 select-window -t :1
bind -n M-3 select-window -t :2
bind -n M-4 select-window -t :3
bind -n M-5 select-window -t :4

# M-w: kill current pane (kills tab if last pane)
bind -n M-w kill-pane

# M-d: detach (minimize, session stays alive)
bind -n M-d detach-client

# M-q: quit workspace
bind -n M-q confirm-before -p "Kill workspace? (y/n)" kill-session

# ── Lazygit popup ──────────────────────────────────────────
bind -n M-g display-popup -d '#{pane_current_path}' -w 90% -h 90% -E 'lazygit'

# ── Switch session ─────────────────────────────────────────
# M-o: switch session
bind -n M-o choose-tree -s -f '#{==:#{session_group},}' -O name

# ── Help popup (M-/) ──────────────────────────────────────
bind -n M-/ display-popup -w 50 -h 18 -E 'bash -c "cat <<EOF

  ── Workspace Shortcuts ──

  M-c/x/t   new pane (claude/codex/shell)
  M-C/X/T   new tab  (claude/codex/shell)
  M-Tab     cycle tabs
  M-[ / M-] prev / next tab
  M-1..5    jump to tab #
  M-hjkl    navigate panes
  M-z       zoom / unzoom pane
  M-o       switch session
  M-g       lazygit
  M-w       kill pane
  M-e       scroll mode
  M-d       detach
  M-q       quit workspace

  press q to close
EOF
read -rsn1"'

# ── Scroll mode ─────────────────────────────────────────────
bind -n M-e copy-mode
bind -T copy-mode k send-keys -X -N 5 scroll-up
bind -T copy-mode j send-keys -X -N 5 scroll-down
bind -T copy-mode K send-keys -X halfpage-up
bind -T copy-mode J send-keys -X halfpage-down

# ── Pane navigation (vim: hjkl) ────────────────────────────
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# ── Appearance ──────────────────────────────────────────────
set -g allow-rename off
set -g pane-border-lines single
set -g pane-border-indicators off
set -g pane-border-status off

# Catppuccin theme (mocha flavor) — change to latte/frappe/macchiato to taste
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
# Dim inactive pane borders (surface_0 ≈ bg); mauve for the active pane
set -g @catppuccin_pane_border_style        "fg=#{@thm_surface_0}"
set -g @catppuccin_pane_active_border_style "fg=#{@thm_mauve}"

# Status bar position + lengths
set -g status on
set -g status-position bottom
set -g status-left-length 100
set -g status-right-length 100

# Cap window title length (truncate to 30 chars with ellipsis)
set -g @catppuccin_window_text " #{=/30/…:#{T:#W}}"
set -g @catppuccin_window_current_text "#{?window_zoomed_flag, Z , }#{=/30/…:#{T:#W}}"

# Hide icons on status-right modules + the colored rounded left caps
set -g @catppuccin_application_icon ""
set -g @catppuccin_cpu_icon ""
set -g @catppuccin_session_icon ""
set -g @catppuccin_uptime_icon ""
set -g @catppuccin_battery_icon ""
set -g @catppuccin_status_left_separator ""

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Showcase layout (matches catppuccin/tmux mocha preview)
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

run ~/.config/tmux/plugins/tmux-plugins/tmux-cpu/cpu.tmux
run ~/.config/tmux/plugins/tmux-plugins/tmux-battery/battery.tmux

# Ghostty window title
set -g set-titles on
set -g set-titles-string "#{session_name}"
